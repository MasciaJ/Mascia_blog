{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mascia Web | Publicaciones</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'portfolio/style.css' %}">
</head>
<body class="d-flex flex-column min-vh-100">
    <input type="checkbox" id="theme-toggle" class="theme-toggle-checkbox">
    <header class="navbar sticky-top custom-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold text-white" href="{% url 'portfolio' %}">Mascia Web</a>
            <nav class="d-flex align-items-center gap-3">
                <a href="{% url 'portfolio' %}#sobre-mi" class="nav-link text-white">Sobre mí</a>
                <a href="{% url 'portfolio' %}#proyectos" class="nav-link text-white">Proyectos</a>
                <a href="{% url 'portfolio' %}#publicaciones" class="nav-link text-white">Publicaciones</a>
                <label for="theme-toggle" class="theme-btn">
                    <span class="icon-dark">Modo Oscuro</span>
                    <span class="icon-light">Modo Claro</span>
                </label>
            </nav>
        </div>
    </header>
    <main class="container my-4 flex-grow-1">
        <section class="portfolio-section">
            {% block page_title %}{% endblock page_title %}
            {% block page_content %}{% endblock page_content %}
        </section>
    </main>
    <footer class="custom-footer text-center py-3 mt-auto">
        <p class="mb-0">&copy; 2026 Mascia Web - Todos los derechos reservados</p>
    </footer>
</body>
</html>
